<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Welcome to your 20s</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0a0a0b;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            /* Prevents pull-to-refresh on mobile */
            overscroll-behavior: none;
        }

        #overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            z-index: 10;
            pointer-events: none;
            width: 90%; /* Ensure text doesn't hit edges on small screens */
        }

        h1 {
            /* Responsive font size using 'vw' (viewport width) */
            font-size: clamp(1.8rem, 8vw, 4rem);
            font-weight: 200;
            letter-spacing: clamp(4px, 2vw, 12px);
            margin: 0;
            text-transform: uppercase;
            opacity: 0.9;
        }

        p {
            font-size: clamp(0.7rem, 3vw, 1.1rem);
            letter-spacing: 3px;
            font-weight: 300;
            opacity: 0.5;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div id="overlay">
        <h1>Welcome to your 20s</h1>
    </div>

    <script>
        const flock = [];
        let boidCount;

        function setup() {
            createCanvas(windowWidth, windowHeight);

            // Adjust bird count based on screen width for performance
            boidCount = windowWidth < 600 ? 80 : 180;

            for (let i = 0; i < boidCount; i++) {
                flock.push(new Boid());
            }
        }

        function draw() {
            // Darker trail for mobile to hide lower frame rates if they occur
            background(10, 10, 11, 35);

            for (let boid of flock) {
                boid.edges();
                boid.flock(flock);

                // Add attraction to touch/mouse
                if (mouseIsPressed || (touches.length > 0)) {
                    let target = createVector(mouseX, mouseY);
                    boid.arrive(target);
                }

                boid.update();
                boid.show();
            }
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }

        class Boid {
            constructor() {
                this.position = createVector(random(width), random(height));
                this.velocity = p5.Vector.random2D();
                this.velocity.setMag(random(2, 4));
                this.acceleration = createVector();
                this.maxForce = 0.2;
                this.maxSpeed = 3.5; // Slightly slower for a more "graceful" look
            }

            edges() {
                if (this.position.x > width) this.position.x = 0;
                else if (this.position.x < 0) this.position.x = width;
                if (this.position.y > height) this.position.y = 0;
                else if (this.position.y < 0) this.position.y = height;
            }

            // Simple attraction behavior for touch
            arrive(target) {
                let force = p5.Vector.sub(target, this.position);
                let d = force.mag();
                if (d < 100) {
                    force.setMag(this.maxSpeed);
                    force.sub(this.velocity);
                    force.limit(this.maxForce * 2);
                    this.acceleration.add(force);
                }
            }

            flock(boids) {
                let alignment = this.align(boids);
                let cohesion = this.cohesion(boids);
                let separation = this.separation(boids);

                alignment.mult(1.0);
                cohesion.mult(1.1);
                separation.mult(1.4);

                this.acceleration.add(alignment);
                this.acceleration.add(cohesion);
                this.acceleration.add(separation);
            }

            update() {
                this.position.add(this.velocity);
                this.velocity.add(this.acceleration);
                this.velocity.limit(this.maxSpeed);
                this.acceleration.mult(0);
            }

            show() {
                // Larger points for mobile screens to make them easier to see
                let size = windowWidth < 600 ? 3 : 2;
                strokeWeight(size);
                stroke(220, 220, 255, 180);
                point(this.position.x, this.position.y);
            }

            align(boids) {
                let perception = 50;
                let steering = createVector();
                let total = 0;
                for (let other of boids) {
                    let d = dist(this.position.x, this.position.y, other.position.x, other.position.y);
                    if (other != this && d < perception) {
                        steering.add(other.velocity);
                        total++;
                    }
                }
                if (total > 0) {
                    steering.div(total).setMag(this.maxSpeed).sub(this.velocity).limit(this.maxForce);
                }
                return steering;
            }

            separation(boids) {
                let perception = 30;
                let steering = createVector();
                let total = 0;
                for (let other of boids) {
                    let d = dist(this.position.x, this.position.y, other.position.x, other.position.y);
                    if (other != this && d < perception) {
                        let diff = p5.Vector.sub(this.position, other.position);
                        diff.div(d * d);
                        steering.add(diff);
                        total++;
                    }
                }
                if (total > 0) {
                    steering.div(total).setMag(this.maxSpeed).sub(this.velocity).limit(this.maxForce);
                }
                return steering;
            }

            cohesion(boids) {
                let perception = 80;
                let steering = createVector();
                let total = 0;
                for (let other of boids) {
                    let d = dist(this.position.x, this.position.y, other.position.x, other.position.y);
                    if (other != this && d < perception) {
                        steering.add(other.position);
                        total++;
                    }
                }
                if (total > 0) {
                    steering.div(total).sub(this.position).setMag(this.maxSpeed).sub(this.velocity).limit(this.maxForce);
                }
                return steering;
            }
        }
    </script>
</body>
</html>
