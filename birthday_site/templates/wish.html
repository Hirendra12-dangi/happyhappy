<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday!</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/feather-icons"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700&display=swap');

    body {
      font-family: 'Baloo 2', cursive;
      overflow: hidden;
      /* Realistic Deep Night Gradient */
      background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
      margin: 0;
    }

    /* Nebula/Milky Way Effect */
    .nebula {
      position: absolute;
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at 50% 50%, rgba(65, 105, 225, 0.05) 0%, transparent 70%);
      filter: blur(50px);
      z-index: 0;
    }

    /* Realistic Stars */
    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      opacity: 0;
      animation: twinkle var(--duration) infinite ease-in-out;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 0.8; transform: scale(1.1); }
    }

    /* Original Card Animations */
    .cake-candle { animation: flicker 0.8s infinite alternate; }
    @keyframes flicker {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(0.95); }
    }
    .bounce { animation: bounce 2s infinite; }
    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
      40% {transform: translateY(-30px);}
      60% {transform: translateY(-15px);}
    }
    #speakerIcon { display: inline-block; margin-top: 16px; color: white; cursor: pointer; z-index: 999; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

  <div class="nebula"></div>
  <div id="stars-container"></div>

  <div class="max-w-md w-full bg-white/20 backdrop-blur-md rounded-3xl shadow-xl overflow-hidden p-8 text-center relative z-10 border-2 border-white/30">
    <h1 class="text-5xl font-bold text-white mb-6 bounce">Happy Birthday To A Sweet Soul!</h1>

    <div class="relative w-48 h-48 mx-auto mb-8">
      <img src="https://gifdb.com/images/high/animated-happy-bear-birthday-yxljhlocpq4recrm.gif" alt="Birthday" class="w-full h-full object-cover rounded-full border-4 border-white shadow-lg" id="birthdayImage" />

      <div class="absolute -bottom-4 left-1/2 transform -translate-x-1/2 w-24">
        <div class="bg-yellow-200 w-16 h-12 mx-auto rounded-t-full relative">
          <div class="absolute top-0 left-1/2 transform -translate-x-1/2 -translate-y-4">
            <div class="cake-candle bg-red-500 w-2 h-8 mx-auto rounded-t-sm"></div>
            <div class="cake-candle bg-yellow-300 w-3 h-1 mx-auto mt-1 rounded-full"></div>
          </div>
        </div>
        <div class="bg-pink-300 w-20 h-4 mx-auto rounded-b-lg"></div>
      </div>
    </div>

    <p class="text-white text-xl mb-6 animate-pulse">Wishing you an amazing day filled with joy!</p>

    <button id="confettiBtn" class="bg-gradient-to-r from-yellow-300 to-pink-400 hover:from-pink-400 hover:to-purple-500 text-white font-bold py-3 px-6 rounded-full shadow-lg transform hover:scale-105 transition-all duration-300 flex items-center mx-auto">
      <i data-feather="gift" class="mr-2"></i>
      Click here!
    </button>

    <div class="mt-8">
      <button onclick="nextPage()" class="bg-white text-purple-600 px-8 py-3 rounded-full font-bold text-lg hover:bg-purple-100 transition-all duration-300 bounce">
             Next!
      </button>
    </div>

    <div id="speakerIcon" title="Click to unmute">
        <i data-feather="volume-x"></i>
    </div>
        <audio id="birthday-music" loop>
            <source src="{{ url_for('static', filename='sounds/happy-birthday-357371.mp3') }}" type="audio/mp3">
            Your browser does not support the audio element.
        </audio>
  </div>

<script>
  // Realistic Star Generation
  function initStars() {
    const container = document.getElementById('stars-container');
    const starCount = 200; // More stars for realism

    for (let i = 0; i < starCount; i++) {
      const star = document.createElement('div');
      star.className = 'star';

      // Random sizes (mostly small, a few larger)
      const size = (Math.random() * 2) + 0.5 + 'px';
      star.style.width = size;
      star.style.height = size;

      // Random positions
      star.style.left = Math.random() * 100 + '%';
      star.style.top = Math.random() * 100 + '%';

      // Random animation timing
      star.style.setProperty('--duration', (Math.random() * 3 + 3) + 's');
      star.style.animationDelay = Math.random() * 5 + 's';

      // Random tint (slight blue/yellow/white)
      const colors = ['#ffffff', '#ffffff', '#dfefff', '#fff9e5'];
      star.style.background = colors[Math.floor(Math.random() * colors.length)];

      container.appendChild(star);
    }
  }

  initStars();

  const music = document.getElementById('birthday-music');
  let musicStarted = false;

  function handleInteraction() {
      if (!musicStarted && music) {
          music.play().then(() => {
              musicStarted = true;
              console.log("Music started successfully!");
          }).catch(error => {
              // Still waiting for a 'strong' interaction
              console.log("Waiting for more user interaction to play music...");
          });
      }
  }

  // Start music when they move the mouse or touch the screen
  window.addEventListener('mousedown', handleInteraction);
  window.addEventListener('touchstart', handleInteraction);


  function nextPage() {
    window.location.href = "{{ url_for('welcome') }}";
  }

  document.getElementById('confettiBtn').addEventListener('click', function () {
    const candle = document.querySelector('.cake-candle');
    const rect = candle.getBoundingClientRect();
    const x = (rect.left + rect.width / 2) / window.innerWidth;
    const y = (rect.top + rect.height / 2) / window.innerHeight;

    confetti({
      particleCount: 150,
      spread: 70,
      origin: { x: x, y: y },
      colors: ['#ffffff', '#bfdbfe', '#fef08a', '#ff00ff']
    });

    gsap.to("#birthdayImage", { y: -20, duration: 0.3, yoyo: true, repeat: 1 });
  });
</script>
</body>
</html>
